dataset_name: copper-heavy-metal-screen-v0.15.1
description: >
  Strain-level copper dose-response phenotypes (linear radial-growth-rate model,
  trapezoidal AUC of rate vs. concentration 0-30 mM, cross-metal comparative
  tolerance) plus per-colony terminal-timepoint measurements, from the shared
  ArrayedHeavyMetalScreen project's 0.15.1_Analysis pipeline. One row per
  (Strain ID, plate configuration) for the AUC table; one row per Strain ID for
  the mean-AUC and comparative-tolerance tables.
format: CSV (16 files copied directly; 3 large sources symlinked, see large_source/)

columns:
  # --- copper_auc_all_strains_by_configuration.csv ---
  - name: Strain ID
    type: int
    description: Shared-project integer strain identifier (not this project's strain_code; reconcile via analysis/gwas/results/strain_reconciliation/).
    nullable: false
  - name: configuration
    type: int
    description: Plate replicate/arrangement number (1-4).
    nullable: false
  - name: n_concentrations
    type: int
    description: Number of Cu concentrations (of 0,5,10,15,20,25,30 mM) with a valid QC-passed growth-rate fit contributing to this strain x configuration's AUC.
    nullable: false
  - name: auc_rate
    type: float
    description: Trapezoidal area under (linear radial-growth-rate vs. Cu concentration) curve, pracma::trapz(Concentration_mM, rate), for this strain x configuration.
    units: (mm/hr)*mM, approx -- rate units not confirmed against raw radius units
    nullable: false
  - name: Strain
    type: str
    description: Shared-project strain code (e.g. TFCN_17-291Y-1).
    nullable: true
  - name: Strain Name
    type: str
    description: Free-text collection/isolate name, often multi-line (name + library well).
    nullable: true
  - name: Species
    type: categorical
    description: Species call from shared-project strain metadata.
    nullable: true
  - name: Origin
    type: str
    description: Geographic origin of isolate.
    nullable: true
  - name: Environment
    type: categorical
    description: Isolation environment/habitat.
    nullable: true
  - name: Library Plate
    type: int
    description: Source culture-collection plate number.
    nullable: true
  - name: Incubation Temp (°C)
    type: float
    units: degrees C
    description: Incubation temperature for this strain's screen.
    nullable: true

  # --- copper_auc_mean_by_strain.csv ---
  - name: n_configurations
    type: int
    description: Number of plate configurations (of up to 4) averaged into mean_auc_rate.
    nullable: false
  - name: mean_auc_rate
    type: float
    description: Mean of auc_rate across available configurations for this strain -- the primary strain-level copper dose-response summary statistic in this dataset.
    nullable: false

  # --- comparative_tolerance_*.csv (wide form) ---
  - name: mean_auc_rate_copper
    type: float
    description: Same as mean_auc_rate above, joined alongside the other 3 metals for cross-metal comparison.
    nullable: true
  - name: mean_auc_rate_chromium
    type: float
    description: Analogous chromium-screen mean AUC-rate (see sibling chromium-screen source data, not ingested here).
    nullable: true
  - name: mean_auc_rate_iron
    type: float
    nullable: true
    description: Analogous iron-screen mean AUC-rate.
  - name: mean_auc_rate_ph
    type: float
    nullable: true
    description: Analogous pH-screen mean AUC-rate.
  - name: in_top_quartile_copper
    type: bool
    description: Strain is in the top quartile of mean_auc_rate_copper across all strains.
    nullable: false
  - name: in_bottom_quartile_copper
    type: bool
    nullable: false
    description: Strain is in the bottom quartile of mean_auc_rate_copper.
  - name: n_top
    type: int
    description: Count of metals (of 4) in which this strain is top-quartile.
    nullable: false
  - name: n_bottom
    type: int
    description: Count of metals (of 4) in which this strain is bottom-quartile.
    nullable: false
  - name: profile_class
    type: categorical
    description: Source-project classification of the strain's cross-metal tolerance profile.
    nullable: false
    values:
      - Polytolerant (top in ≥2 conditions)
      - Polysensitive (bottom in ≥2 conditions)
      - Single-condition extreme (top)
      - Single-condition extreme (bottom)
      - Mixed (top in some, bottom in others)
      - Not extreme (middle 50% in all conditions)
    notes: >
      Full 6-category distribution enumerated directly from
      comparative_tolerance_all_strains_all_vs_all.csv (306 rows): Mixed=100,
      Polysensitive=54, Polytolerant=41, Single-top=42, Single-bottom=31,
      Not extreme=38.

  # --- copperterminal_dropped.csv (QC) ---
  - name: run_number
    type: categorical
    description: Imaging run ID (e.g. d000353), same run identifiers as this project's existing copper-colony-measurements dataset.
    nullable: false
  - name: plate_position
    type: int
    nullable: false
    description: Plate position within the run.
  - name: GridColIdx
    type: int
    nullable: false
    description: Column index of the well within the imaged colony grid.
  - name: sample_plate_arrangement
    type: int
    description: Plate replicate/arrangement number (same as `configuration` elsewhere), 1-4.
    nullable: false
  - name: Concentration
    type: float
    units: mM Cu
    nullable: false
    description: Copper concentration for the dropped well.
  - name: run_last_day
    type: int
    units: hours
    description: Last hours_passed value recorded for the whole run.
    nullable: false
  - name: group_last_day
    type: int
    units: hours
    description: Last hours_passed value recorded for this well's plate/concentration group.
    nullable: false
  - name: well_last_hours_passed
    type: int
    units: hours
    nullable: false
    description: Last hours_passed value actually observed for this specific well before it was dropped from downstream analysis (QC exclusion signal -- early well_last_hours_passed relative to group_last_day/run_last_day indicates the well was dropped early).

notes: >
  The per-colony terminal extract in large_source/Copper_terminal_by_concentration/
  and coppermeasurementmeta.csv share the same 181-ish-column CellProfiler-style
  feature schema (Shape_*, Intensity_*, TextureGray_*, Colorxy_*, ColorLab_*,
  ColorHSV_*, plus sample_plate/Metal/Concentration/strain_id/STRAIN/SPECIES join
  columns) as this project's existing copper-colony-measurements DuckDB table
  (data/metadata/copper-colony-measurements/schema.yaml) -- not re-documented
  column-by-column here to avoid duplication; see that schema for the per-colony
  feature definitions. Row count (211,800) matches exactly.
