# Dataset Schema
# Computed by scripts/db/05_generate_metadata.py
# Generated: 2026-08-15

dataset_name: copper-colony-measurements
description: >
  Per-colony measurements for the Copper exposure phenotyping experiment (runs 353-357).
  One row per segmented colony object in each imaged plate well. Each of the 2,398
  preprocessed Parquet files holds the objects detected in one image (one run/plate
  timepoint); rows are keyed by image_name + object_label. Source columns (180) plus
  three database-added key columns (image_name, object_label, well_position).
format: Parquet (source), DuckDB colony_measurement table (database)
unit_of_observation: one row per colony object per image

column_families:
  Metadata_:
    description: Image/run metadata stamped onto every object by the segmentation export.
    units: mixed
  ObjectLabel:
    description: Sequential label of the detected object (colony) within its image.
    units: count
  Bbox_:
    description: Bounding-box geometry of the object in pixel coordinates.
    units: Pixel (row/col index)
  Grid_:
    description: Row/column grid position the object was laid out in.
    units: 1-based grid index
  Shape_:
    description: Morphometric properties of the object (MorphoLibJ).
    units: Pixels (lengths here), pixels^2 (areas); circularity/roundness dimensionless
  Intensity_:
    description: Pixel-intensity statistics of the object in the (gray) channel.
    units: Arbitrary intensity units (AU); dimensionless for ratios/CV
  TextureGray_:
    description: Haralick co-occurrence texture metrics computed from the gray-level co-occurrence matrix at four orientations and their average (MorphoLibJ).
    units: Dimensionless
  Colorxy_:
    description: Median-filtered chromaticity (x,y) statistics of the object.
    units: Dimensionless chromaticity coordinates
  ColorLab_:
    description: Perceptual CIE L*a*b* color statistics of the object.
    units: CIELAB: L* 0-100, a*/b* signed
  ColorHSV_:
    description: HSV color statistics of the object (Hue, Saturation, Brightness).
    units: Hue 0-1 (or 0-360); Saturation/Brightness 0-1

